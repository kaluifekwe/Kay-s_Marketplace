org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation. The project lives on D: while the
# Flutter/pub package cache is on C:, and Kotlin's incremental compiler crashes
# trying to relativize paths across different Windows drive roots
# ("this and base files have different roots"), breaking release AAB/APK builds
# (e.g. via `shorebird release`). Full (non-incremental) compilation is
# unaffected. Remove if the project and pub cache ever share one drive.
kotlin.incremental=false
