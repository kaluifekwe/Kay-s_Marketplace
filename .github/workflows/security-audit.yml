name: Security audit (RLS)

# Fails if the database has any insecure RLS posture: a public table with RLS
# disabled, or a write policy (INSERT/UPDATE/DELETE/ALL) open to a non-service
# role via USING(true)/WITH CHECK(true). See verify_security.sql / docs/SECURITY.md.
#
# Setup (one time): add a repo secret SUPABASE_DB_URL = the Supabase
# "Session pooler" connection URI (Project Settings → Database → Connection
# string → URI, Session/IPv4). It contains the DB password — keep it a secret.
# Best practice: point it at a least-privilege READ-ONLY DB role.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC — catches drift from dashboard changes
  push:
    branches: [main, feat/shipbubble-delivery]
  pull_request:
    branches: [main]

jobs:
  rls-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run RLS / policy audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi

          echo "── Public tables with RLS DISABLED ──"
          psql "$SUPABASE_DB_URL" -P pager=off -c \
            "SELECT c.relname AS table FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' AND NOT c.relrowsecurity ORDER BY 1;"

          echo "── Permissive WRITE policies (open to non-service roles) ──"
          psql "$SUPABASE_DB_URL" -P pager=off -c \
            "SELECT tablename||' / '||policyname AS policy, cmd FROM pg_policies WHERE schemaname='public' AND cmd IN ('INSERT','UPDATE','DELETE','ALL') AND (qual='true' OR with_check='true') AND NOT ('service_role'=ANY(roles)) ORDER BY 1;"

          COUNT=$(psql "$SUPABASE_DB_URL" -tAc \
            "SELECT (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind='r' AND NOT c.relrowsecurity)
                  + (SELECT count(*) FROM pg_policies WHERE schemaname='public' AND cmd IN ('INSERT','UPDATE','DELETE','ALL') AND (qual='true' OR with_check='true') AND NOT ('service_role'=ANY(roles)));")

          echo "Critical issues found: $COUNT"
          if [ "$COUNT" -ne 0 ]; then
            echo "::error::Security audit FAILED — $COUNT critical RLS issue(s) above. Fix before merging/shipping."
            exit 1
          fi
          echo "✅ Security audit passed — no RLS-disabled tables, no permissive write policies."
