name: CodeQL

# GitHub's deep semantic code analysis (follows untrusted input through the
# code to dangerous sinks). Free for public repositories. Complements Semgrep,
# which matches patterns. Covers the TypeScript/JavaScript code (web, admin,
# edge functions). CodeQL does not support Dart (the Flutter app); that code is
# covered by flutter analyze and the AI review.

on:
  pull_request:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 3 * * 1" # weekly, picks up new query packs

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
