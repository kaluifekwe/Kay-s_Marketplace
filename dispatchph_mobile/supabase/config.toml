# Paystack calls this function directly (server-to-server webhook, and a
# GET redirect from the in-app checkout webview) with no Supabase auth
# header — it authenticates itself via the x-paystack-signature header,
# which the function verifies internally. Supabase's platform-level JWT
# gateway must be disabled for this one function or every real webhook
# call gets rejected with 401 before our code ever runs.
[functions.paystack-webhook]
verify_jwt = false

# Shipbubble calls this directly (server-to-server webhook) with no Supabase
# auth header — it authenticates via the x-shipbubble-signature header, which
# the function verifies internally. Same reasoning as paystack-webhook above.
[functions.shipbubble-webhook]
verify_jwt = false

# Terminal Africa calls this directly (server-to-server webhook) with no
# Supabase auth header — it authenticates via the optional x-terminal-signature
# header (TERMINAL_WEBHOOK_SECRET). Same reasoning as the webhooks above.
[functions.terminal-webhook]
verify_jwt = false

# Public product share page (Open Graph). Social-media crawlers and people who
# tap a shared link fetch this with no Supabase auth header, so the platform
# JWT gateway must be off — it only reads public product data.
[functions.share-product]
verify_jwt = false

# Public storefront page (a vendor's whole catalogue). Same reasoning as
# share-product — public, read-only, must be reachable without a JWT.
[functions.share-store]
verify_jwt = false
